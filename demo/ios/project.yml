name: KeystoneFFIDemo

options:
  minimumXcodeGenVersion: 2.45.0
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

targets:
  KeystoneFFIDemo:
    type: application
    platform: iOS
    deploymentTarget: "26.2"
    sources:
      - path: App
      - path: ParseCryptoMultiAccountsDemo.swift
      - path: CryptoMultiAccountsLogSamples.swift
    dependencies:
      - framework: ../../target/URRegistryFFI.xcframework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keystone.demo.iosffi
        PRODUCT_NAME: KeystoneFFIDemo
        SWIFT_VERSION: 5.0
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  KeystoneFFIDemo:
    build:
      targets:
        KeystoneFFIDemo: all
    run:
      config: Debug
    archive:
      config: Release
